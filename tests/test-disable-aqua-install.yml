name: Test enable_aqua_install=false skips aqua i
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install aqua but disable running "aqua i"
      # Without an aqua.yaml in the working directory, "aqua i" would fail
      # By setting enable_aqua_install=false, we skip that step entirely
      - id: action
        uses: .
        with:
          aqua_version: v2.51.2
          enable_aqua_install: "false"
          github_token: ${{ github.token }}

      - name: Assert aqua is installed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found in PATH"
            exit 1
          fi
          VERSION=$(aqua -v 2>&1 || true)
          echo "aqua version: $VERSION"
          echo "PASS: aqua installed successfully with enable_aqua_install=false"

      - name: Assert no tools were installed by aqua i
        run: |
          # Since enable_aqua_install=false, "aqua i" was not run.
          # The action should have completed without error.
          echo "PASS: action completed without running aqua i"
