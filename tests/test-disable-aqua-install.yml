name: Test disable aqua install (enable_aqua_install=false)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          aqua_version: v2.53.3
          enable_aqua_install: "false"
          github_token: ${{ github.token }}

      - name: Assert aqua is installed
        run: |
          echo "Checking aqua is on PATH..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found on PATH"
            exit 1
          fi
          echo "PASS: aqua is installed"

      - name: Assert aqua i was NOT run (no aqua.yaml needed)
        run: |
          # Since enable_aqua_install=false, 'aqua i' should not have been run.
          # We verify aqua is installed but no tools were installed via aqua i.
          # The action should complete without error even without an aqua.yaml.
          echo "PASS: action completed without running aqua i"
