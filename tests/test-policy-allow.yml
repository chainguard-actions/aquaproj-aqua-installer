name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run the action with policy_allow=true; aqua policy allow may exit non-zero
      # if there is no aqua.yaml in the workspace, so we allow failure and assert
      # that the action at least ran (aqua was installed and the policy step was reached).
      - id: action
        uses: .
        continue-on-error: true
        with:
          aqua_version: v2.55.1
          enable_aqua_install: "false"
          policy_allow: "true"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert aqua is installed and policy_allow step was reached
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # aqua must be on PATH regardless of whether policy allow succeeded
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found on PATH"
            exit 1
          fi
          echo "aqua version: $(aqua -v 2>&1 || true)"
          # The action either succeeded (policy allow worked) or failed because
          # there is no aqua.yaml / policy file — both are acceptable outcomes
          # as long as aqua itself was installed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with policy_allow=true (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
