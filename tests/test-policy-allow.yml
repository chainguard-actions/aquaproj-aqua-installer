name: Test policy_allow input with a policy file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create policy file
        run: |
          mkdir -p /tmp/aqua-policy
          cat > /tmp/aqua-policy/aqua-policy.yaml <<'EOF'
          ---
          registries:
            - type: standard
              ref: semver(">= 3.0.0")
          packages:
            - registry: standard
          EOF
          cat /tmp/aqua-policy/aqua-policy.yaml

      - id: action
        uses: .
        with:
          aqua_version: v2.60.1
          enable_aqua_install: "false"
          working_directory: /tmp/aqua-policy
          policy_allow: /tmp/aqua-policy/aqua-policy.yaml

      - name: Assert aqua installed and policy allowed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found in PATH"
            exit 1
          fi
          AQUA_VER=$(aqua version 2>&1 || true)
          echo "aqua version: '$AQUA_VER'"
          if ! echo "$AQUA_VER" | grep -qE "2\.60\.1"; then
            echo "FAIL: expected aqua 2.60.1"
            exit 1
          fi
          ROOT="${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}"
          echo "aqua root contents:"
          find "$ROOT" -maxdepth 3 -path "$ROOT/pkgs" -prune -o -print | head -50
          if find "$ROOT" -path "$ROOT/pkgs" -prune -o -iname '*polic*' -print | grep -q .; then
            echo "PASS: policy was recorded as allowed"
          else
            echo "FAIL: no policy record found under $ROOT"
            exit 1
          fi
