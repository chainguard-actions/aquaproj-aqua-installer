name: Test aqua installation with policy_allow
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          aqua_version: v2.45.0
          enable_aqua_install: "false"
          policy_allow: "true"

      - name: Assert aqua is installed and on PATH
        run: |
          echo "Checking aqua is available on PATH..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found on PATH"
            exit 1
          fi
          echo "PASS: aqua is available"
          aqua --version
