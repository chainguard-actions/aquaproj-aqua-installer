name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install aqua first so it is available for the policy_allow step
      - id: install-aqua
        uses: .
        with:
          aqua_version: v2.60.1
          enable_aqua_install: "false"

      - name: Assert aqua is installed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found after install"
            exit 1
          fi
          echo "PASS: aqua is installed"

      # Run with policy_allow=true — this triggers "aqua policy allow" (no args).
      # In the test environment there may be no policy file, so the command may
      # fail gracefully. We allow failure and assert on the outcome.
      - id: policy-allow-true
        uses: .
        with:
          aqua_version: v2.60.1
          skip_install_aqua: "true"
          enable_aqua_install: "false"
          policy_allow: "true"
        continue-on-error: true

      - name: Assert policy_allow step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.policy-allow-true.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: policy_allow=true step succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: policy_allow=true step failed gracefully (no policy file in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
