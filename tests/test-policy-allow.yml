name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install aqua first so it is on PATH before testing policy_allow
      - id: install-aqua
        uses: .
        with:
          aqua_version: v2.53.3
          enable_aqua_install: "false"

      - name: Verify aqua is installed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found on PATH after install"
            exit 1
          fi
          echo "PASS: aqua is on PATH"

      # Test policy_allow: "true" — runs "aqua policy allow" (no argument)
      # The command may fail if no aqua.yaml policy is configured, so we allow
      # failure and assert the action ran the step (not an unexpected error).
      - id: action-policy-allow
        uses: .
        with:
          aqua_version: v2.53.3
          enable_aqua_install: "false"
          skip_install_aqua: "true"
          policy_allow: "true"
        continue-on-error: true

      - name: Assert policy_allow step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action-policy-allow.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with policy_allow=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran and failed gracefully (no policy file configured — expected in test env)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
