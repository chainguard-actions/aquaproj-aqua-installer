name: Test policy_allow input with a policy file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create policy file
        run: |
          mkdir -p /tmp/aqua-policy-test
          cat > /tmp/aqua-policy-test/aqua-policy.yaml <<'EOF'
          registries:
            - type: standard
              ref: semver(">= 3.0.0")
          packages:
            - registry: standard
          EOF
          cat /tmp/aqua-policy-test/aqua-policy.yaml

      - id: action
        uses: .
        with:
          aqua_version: v2.51.2
          enable_aqua_install: "false"
          policy_allow: /tmp/aqua-policy-test/aqua-policy.yaml
          github_token: ${{ github.token }}

      - name: Assert aqua installed and policy allowed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "success" ]; then
            echo "FAIL: action did not succeed"
            exit 1
          fi
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found in PATH"
            exit 1
          fi
          aqua -v
          ROOT="${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}"
          echo "aqua root contents:"
          find "$ROOT" -maxdepth 3 -path "$ROOT/pkgs" -prune -o -print 2>/dev/null | head -50 || true
          echo "PASS: policy_allow step ran successfully"
