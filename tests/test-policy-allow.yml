name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Install aqua first so the policy allow command can be found
      - name: Install aqua
        uses: .
        with:
          aqua_version: v2.51.2
          enable_aqua_install: "false"
          github_token: ${{ github.token }}

      - name: Verify aqua is installed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found after install"
            exit 1
          fi
          echo "aqua is installed: $(aqua -v 2>&1 || true)"

      # Test policy_allow=true: runs "aqua policy allow"
      # The command may exit non-zero if no policy file exists, so we allow failure
      # and assert that the step was at least attempted (not skipped).
      - id: policy-allow-true
        name: Run action with policy_allow=true
        uses: .
        with:
          aqua_version: v2.51.2
          skip_install_aqua: "true"
          enable_aqua_install: "false"
          policy_allow: "true"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert policy_allow=true step ran (not skipped)
        env:
          OUTCOME: ${{ steps.policy-allow-true.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: policy_allow=true step was skipped unexpectedly"
            exit 1
          fi
          # success or failure are both acceptable — the step ran and attempted
          # "aqua policy allow"; failure is expected when no policy file exists
          echo "PASS: policy_allow=true step ran with outcome=$OUTCOME"
