name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test-policy-allow-true:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install aqua with policy_allow=true
        id: action
        uses: .
        with:
          aqua_version: v2.48.0
          enable_aqua_install: "false"
          policy_allow: "true"
        continue-on-error: true

      - name: Assert action ran (policy allow may fail without aqua.yaml but aqua must be installed)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # aqua should be installed regardless; policy allow may fail without a policy file
          # but the action itself should have run (success or graceful failure)
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with policy_allow=true (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert aqua binary is available on PATH
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua binary not found on PATH"
            exit 1
          fi
          echo "PASS: aqua is available: $(aqua version)"

  test-policy-allow-file:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install aqua with policy_allow pointing to a file path
        id: action-file
        uses: .
        with:
          aqua_version: v2.48.0
          enable_aqua_install: "false"
          policy_allow: "aqua-policy.yaml"
        continue-on-error: true

      - name: Assert action ran with policy_allow file path
        env:
          OUTCOME: ${{ steps.action-file.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # policy allow with a file path may fail if the file doesn't exist,
          # but the action should have attempted to run it
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with policy_allow=aqua-policy.yaml (outcome: $OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert aqua binary is available on PATH
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua binary not found on PATH"
            exit 1
          fi
          echo "PASS: aqua is available: $(aqua version)"
