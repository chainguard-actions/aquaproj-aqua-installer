name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First install aqua so it is available on PATH
      - name: Install aqua
        uses: .
        with:
          aqua_version: v2.51.2
          enable_aqua_install: "false"
          github_token: ${{ github.token }}

      - name: Verify aqua is installed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found after install"
            exit 1
          fi
          echo "aqua is installed: $(aqua -v 2>&1 || true)"

      # Create a minimal aqua-policy.yaml so that "aqua policy allow" has something to act on
      - name: Create aqua-policy.yaml
        run: |
          cat > aqua-policy.yaml <<'EOF'
          packages:
            - registry: standard
              name: ".*"
          registries:
            - type: standard
              ref: latest
          EOF
          echo "Created aqua-policy.yaml"

      # Run the action with policy_allow='true' — exercises the policy_allow input path
      - id: action-policy-allow
        uses: .
        continue-on-error: true
        with:
          aqua_version: v2.51.2
          skip_install_aqua: "true"
          enable_aqua_install: "false"
          policy_allow: "true"
          github_token: ${{ github.token }}

      - name: Assert policy_allow step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.action-policy-allow.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with policy_allow=true"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (expected when no valid policy file is present)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
