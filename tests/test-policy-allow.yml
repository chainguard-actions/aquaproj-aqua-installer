name: Test policy_allow input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First install aqua so it's available on PATH
      - id: install-aqua
        uses: .
        with:
          aqua_version: v2.53.3
          enable_aqua_install: "false"
          github_token: ${{ github.token }}

      - name: Verify aqua is installed
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found on PATH after install"
            exit 1
          fi
          echo "PASS: aqua is available"

      # Test policy_allow=true: runs "aqua policy allow" (no argument).
      # This may fail if there is no aqua.yaml policy file in the workspace,
      # but the step exercises the policy_allow input path.
      - id: policy-allow-true
        uses: .
        with:
          aqua_version: v2.53.3
          enable_aqua_install: "false"
          skip_install_aqua: "true"
          policy_allow: "true"
          github_token: ${{ github.token }}
        continue-on-error: true

      - name: Assert policy_allow step ran (success or graceful failure)
        env:
          OUTCOME: ${{ steps.policy-allow-true.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: policy_allow=true step succeeded"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: policy_allow=true step failed gracefully (no policy file present — expected in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
