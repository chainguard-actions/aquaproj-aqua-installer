name: Test basic aqua install
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          aqua_version: v2.53.10
          enable_aqua_install: "false"

      - name: Assert aqua is on PATH and executable
        run: |
          echo "Checking aqua is available..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found on PATH"
            exit 1
          fi
          echo "PASS: aqua found at $(command -v aqua)"

      - name: Assert aqua version matches requested
        run: |
          VERSION=$(aqua -v 2>&1 || true)
          echo "aqua version output: $VERSION"
          if [ -z "$VERSION" ]; then
            echo "FAIL: aqua -v returned empty output"
            exit 1
          fi
          if echo "$VERSION" | grep -q "2.53.10"; then
            echo "PASS: aqua version 2.53.10 confirmed"
          else
            echo "FAIL: expected 2.53.10 in version output, got: $VERSION"
            exit 1
          fi
