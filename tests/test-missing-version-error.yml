name: Test error when aqua_version is empty
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action checks: if inputs.aqua_version == '' then exit 1
      # Passing empty string should trigger the error step
      - id: action
        uses: .
        continue-on-error: true
        with:
          aqua_version: ""
          enable_aqua_install: "false"

      - name: Assert action failed due to missing version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed when aqua_version is empty"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed with empty aqua_version"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
