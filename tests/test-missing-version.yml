name: Test missing aqua_version fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action.yml marks aqua_version as required: true, so passing an empty
      # string should trigger the guard step that exits 1 with an error message.
      - id: action
        uses: .
        continue-on-error: true
        with:
          aqua_version: ""
          enable_aqua_install: "false"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert action failed when aqua_version is empty
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when aqua_version is empty, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when aqua_version is empty"
