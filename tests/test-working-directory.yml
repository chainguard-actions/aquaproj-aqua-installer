name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory
        run: mkdir -p /tmp/aqua-workdir

      - id: action
        uses: .
        with:
          aqua_version: v2.55.1
          enable_aqua_install: "false"
          working_directory: /tmp/aqua-workdir
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Assert aqua is installed when working_directory is set
        run: |
          echo "Checking aqua is available..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found on PATH"
            exit 1
          fi
          echo "aqua version: $(aqua -v 2>&1 || true)"
          echo "PASS: aqua installed successfully with working_directory set"
