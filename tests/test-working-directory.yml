name: Test working_directory input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create working directory
        run: mkdir -p /tmp/aqua-workdir

      - id: action
        uses: .
        with:
          aqua_version: v2.60.1
          enable_aqua_install: "false"
          working_directory: /tmp/aqua-workdir

      - name: Assert aqua is installed and available
        run: |
          echo "PATH: $PATH"
          echo "Checking aqua is available..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found in PATH"
            exit 1
          fi
          AQUA_VER=$(aqua version 2>&1 || true)
          echo "aqua version: '$AQUA_VER'"
          if echo "$AQUA_VER" | grep -qE "2\.60\.1"; then
            echo "PASS: aqua installed correctly with working_directory set"
          else
            echo "FAIL: expected aqua version 2.60.1 but got: $AQUA_VER"
            exit 1
          fi
