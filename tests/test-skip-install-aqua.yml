name: Test skip_install_aqua when aqua already installed
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # First install aqua normally
      - id: first-install
        uses: .
        with:
          aqua_version: v2.60.1
          enable_aqua_install: "false"

      - name: Verify aqua is installed after first install
        run: |
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua not found after first install"
            exit 1
          fi
          AQUA_VER=$(aqua version 2>&1 || true)
          echo "aqua is installed: $AQUA_VER"
          echo "PASS"

      # Now run again with skip_install_aqua=true — should skip re-installing
      - id: skip-install
        uses: .
        with:
          aqua_version: v2.60.1
          skip_install_aqua: "true"
          enable_aqua_install: "false"

      - name: Assert aqua is still available after skip
        run: |
          echo "Checking aqua is still available after skip_install_aqua=true..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found after skip_install_aqua=true"
            exit 1
          fi
          AQUA_VER=$(aqua version 2>&1 || true)
          echo "aqua version: '$AQUA_VER'"
          if echo "$AQUA_VER" | grep -qE "2\.60\.1"; then
            echo "PASS: aqua is still available and correct version after skip"
          else
            echo "FAIL: expected aqua version 2.60.1 but got: $AQUA_VER"
            exit 1
          fi
