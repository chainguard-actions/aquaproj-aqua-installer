name: Test basic aqua installation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          aqua_version: v2.48.1
          enable_aqua_install: "false"

      - name: Assert aqua is installed and on PATH
        run: |
          echo "Checking aqua is available..."
          if ! command -v aqua > /dev/null 2>&1; then
            echo "FAIL: aqua command not found on PATH"
            exit 1
          fi
          VERSION=$(aqua -v 2>&1 || true)
          echo "aqua version output: $VERSION"
          echo "PASS: aqua is installed and available on PATH"

      - name: Assert aqua version matches requested
        run: |
          VERSION=$(aqua -v 2>&1 || true)
          echo "aqua version: $VERSION"
          if echo "$VERSION" | grep -q "2.48.1"; then
            echo "PASS: aqua version matches v2.48.1"
          else
            echo "FAIL: expected version 2.48.1 in output: $VERSION"
            exit 1
          fi
