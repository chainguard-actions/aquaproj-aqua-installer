name: Install aqua
description: Install aqua https://aquaproj.github.io/ and install tools with aqua
inputs:
  aqua_version:
    description: Installed aqua's version (e.g. v0.8.7)
    required: true
  github_token:
    description: GitHub access token
    required: false
    default: ${{ github.token }}
  enable_aqua_install:
    required: false
    default: "true"
    description: Whether "aqua i" command is run.
  aqua_opts:
    required: false
    default: "-l"
    description: |
      Command line options for "aqua i".
      If packages is set and this is the default value "-l", this is ignored,
      because "-l" skips installing the packages.
  packages:
    required: false
    description: |
      Command or package names to be installed. aqua v2.64.0 or later is required.
      Names are separated by whitespace or newlines.
      Empty lines and text after "#" are ignored.
  policy_allow:
    required: false
    description: |
      aqua >= v2.3.0
      If this isn't empty, "aqua policy allow" is run.
      If this is "true", "aqua policy allow" is run without argument.
      If this isn't empty and isn't "true", "aqua policy allow <inputs.policy_allow>" is run.

  skip_install_aqua:
    required: false
    default: "false"
    description: If this true and aqua is already installed, installing aqua is skipped.

  working_directory:
    required: false
    default: ""
    description: The working directory to run aqua commands
runs:
  using: composite
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - run: |
        echo "::error ::aqua_version is required. https://github.com/aquaproj/aqua-installer"
        exit 1
      shell: bash
      if: inputs.aqua_version == ''

    - run: |
        aqua_bin="${AQUA_ROOT_DIR:-${XDG_DATA_HOME:-$HOME/.local/share}/aquaproj-aqua}/bin"
        printf '%s\n' "$(printf '%s' "$aqua_bin" | tr -d '\n\r')" >> "$GITHUB_PATH"
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      if: runner.os != 'Windows'

    - run: |
        aqua_bin="${AQUA_ROOT_DIR:-$HOME/AppData/Local/aquaproj-aqua}/bin"
        printf '%s\n' "$(printf '%s' "$aqua_bin" | tr -d '\n\r')" >> "$GITHUB_PATH"
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      if: runner.os == 'Windows'

    - run: |
        $aquaBin = $(if ($env:AQUA_ROOT_DIR) { $env:AQUA_ROOT_DIR } else { "$HOME/AppData/Local/aquaproj-aqua/bin" })
        $aquaBin = "$aquaBin" -replace "[`r`n]", ""
        $aquaBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      shell: pwsh
      working-directory: ${{ inputs.working_directory }}
      if: runner.os == 'Windows'

    - run: |
        if [ "${SKIP_INSTALL_AQUA:-}" = true ] && command -v aqua >/dev/null; then
          echo "[INFO] Installing aqua is skipped" >&2
          exit 0
        fi
        "${GITHUB_ACTION_PATH}/aqua-installer" -v "$AQUA_VERSION"
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      env:
        AQUA_VERSION: ${{ inputs.aqua_version }}
        SKIP_INSTALL_AQUA: ${{ inputs.skip_install_aqua }}
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - run: aqua policy allow
      working-directory: ${{ inputs.working_directory }}
      if: inputs.policy_allow == 'true'
      shell: bash

    - run: aqua policy allow "$POLICY_FILE"
      working-directory: ${{ inputs.working_directory }}
      if: |
        inputs.policy_allow != 'true' && inputs.policy_allow != ''
      shell: bash
      env:
        POLICY_FILE: ${{ inputs.policy_allow }}

    - run: |
        set -f
        pkgs=()
        while IFS= read -r line; do
          line=${line%%#*}
          words=()
          if [ -n "$line" ]; then
            read -r -d '' -a words <<< "$line" || true
          fi
          if [ "${#words[@]}" -gt 0 ]; then
            pkgs+=("${words[@]}")
          fi
        done <<< "$PKGS"
        if [ "${#pkgs[@]}" -gt 0 ] && [ "$OPTS" = "-l" ]; then
          OPTS=""
        fi
        opts=()
        if [ -n "$OPTS" ]; then
          read -r -d '' -a opts <<< "$OPTS" || true
        fi
        aqua i ${opts[@]+"${opts[@]}"} -- ${pkgs[@]+"${pkgs[@]}"}
      if: inputs.enable_aqua_install == 'true'
      working-directory: ${{ inputs.working_directory }}
      shell: bash
      env:
        OPTS: ${{ inputs.aqua_opts }}
        PKGS: ${{ inputs.packages }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
